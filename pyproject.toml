[project]
name = "camillerpg"
version = "0.1.0"
description = "A game master bot for animating your tabletop RPG sessions"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Jonathan Tremesaygues", email = "jonathan@tremesaygues.eu" },
]
requires-python = ">=3.14"
dependencies = [
    "aiofiles",
    "pydantic-ai-harness",
    "pydantic-ai-slim",
    "python-dotenv",
]

[project.optional-dependencies]
mattermost = ["httpx2[ws]"]
logfire = ["pydantic-ai-slim[logfire]"]
google = ["pydantic-ai-slim[google]"]

[project.scripts]
camillerpg = "camillerpg.main:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
