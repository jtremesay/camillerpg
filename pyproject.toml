[project]
name = "camillerpg"
version = "0.1.0"
description = "A game master bot for animating your tabletop RPG sessions"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Jonathan Tremesaygues", email = "jonathan@tremesaygues.eu" },
]
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "httpx2[ws]>=2.13.1",
    "pydantic-ai-harness>=0.54.0",
    "pydantic-ai-slim[google,logfire]>=2.52.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
camillerpg = "camillerpg.main:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
